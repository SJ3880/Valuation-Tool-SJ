<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Peer 밸류에이션</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peer 밸류">
<link rel="icon" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--mu:#6b7280;--line:#e5e7eb;--accent:#0f766e;--err:#b91c1c}
@media (prefers-color-scheme: dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e5e7eb;--mu:#9ca3af;--line:#2a313c;--accent:#14b8a6;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding:16px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
.box img{width:64px;height:64px;border-radius:14px}
h1{font-size:20px;margin:14px 0 4px}
p{color:var(--mu);font-size:13px;margin:0 0 18px;line-height:1.6}
input[type=password]{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);border-color:transparent}
label.rem{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--mu);margin:12px 0}
button{width:100%;font-size:15px;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;font-size:13px;color:var(--err);margin-top:10px}
</style>
</head>
<body>
<form class="box" id="pv-lock" autocomplete="on">
  <img src="icons/icon-192.png?v=2" alt="">
  <h1>Peer 밸류에이션</h1>
  <p>초대받은 사람만 볼 수 있어요.<br>받은 비밀번호를 입력하세요.</p>
  <input type="text" name="username" value="peer-valuation" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" autofocus required>
  <label class="rem"><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
  <button id="go">열기</button>
  <div class="msg" id="msg"></div>
</form>
<script>
const P = /*PAYLOAD*/null;
const KEY = 'pv:lock';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const ls = { get(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } },
             set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} } };
async function unwrap(bits, slot){
  try { const wk = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
        return await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(slot.i) }, wk, b64(slot.c)); } catch (e) { return null; }
}
async function open(k){
  const key = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.d)));
  window.__pvLocked = true;
  document.open(); document.write(html); document.close();
}
(async () => {   // 기억해 둔 기기면 바로 열기
  for (const saved of ls.get()) for (const sl of P.slots) { const k = await unwrap(b64(saved), sl); if (k) return open(k); }
  document.getElementById('pw').focus();
})();
document.getElementById('pv-lock').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, btn = document.getElementById('go'), msg = document.getElementById('msg');
  if (!pw) return;
  btn.disabled = true; btn.textContent = '확인 중…'; msg.textContent = '';
  const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  for (const sl of P.slots) {
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(sl.s), iterations: P.n }, raw, 256);
    const k = await unwrap(bits, sl);
    if (k) { if (document.getElementById('rem').checked) ls.set([toB64(bits)]); return open(k); }
  }
  btn.disabled = false; btn.textContent = '열기'; msg.textContent = '비밀번호가 맞지 않아요.';
  document.getElementById('pw').select();
});
</script>
</body>
</html>
