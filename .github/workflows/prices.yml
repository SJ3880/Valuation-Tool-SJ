# 주가만 바로 받기(KRX) — 재무 수집과 따로 돌림. 필요할 때 수동 실행
name: 주가만 받기(KRX)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: KRX 주가 받기
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          ONLY_PRICES: "1"
          TIME_LIMIT_MIN: "75"
        run: python scripts/update.py
      - name: 저장(커밋)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/px data/px_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "주가 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
