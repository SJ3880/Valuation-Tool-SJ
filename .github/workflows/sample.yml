name: 임시 - 사업보고서 샘플
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python3 scripts/sample_docs.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - run: |
          cd sample && tar czf ../sample.tgz . && cd ..
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tmp-sample && git rm -rq --cached . && git add sample.tgz && git commit -qm "임시 샘플" && git push -f origin tmp-sample
