name: 임시 - 사업보고서 샘플
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python3 scripts/sample_docs.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: sample
          path: sample/
          retention-days: 1
